    <clipPath id="image-frame"><rect x="835" y="100" width="330" height="430" rx="10"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="{{BACKGROUND}}"/>
  <rect x="70" y="70" width="730" height="490" fill="#19272b"/>
  <rect x="70" y="70" width="180" height="58" fill="#0ea5e9"/>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif" text-anchor="middle">
    <text x="160" y="108" fill="#fff" font-size="24" font-weight="700">pochizo</text>
    <text x="435" y="265" fill="#fff" font-size="{{FONT_SIZE}}" font-weight="700">{{TITLE_1}}</text>
    <text x="435" y="380" fill="#fff" font-size="{{FONT_SIZE}}" font-weight="700">{{TITLE_2}}</text>
  </g>
  <image href="{{IMAGE}}" x="835" y="100" width="330" height="430" preserveAspectRatio="xMidYMid {{FIT}}" clip-path="url(#image-frame)"/>
