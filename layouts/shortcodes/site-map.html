{{ $isJapanese := eq site.Language.Lang "ja" }}
{{ range $section := slice "blog" "work" "profile" "policy" }}
  {{ with site.GetPage $section }}
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    {{ with .RegularPages.ByTitle }}
      <ul>
        {{ range . }}
          <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
      </ul>
    {{ end }}
  {{ end }}
{{ end }}
